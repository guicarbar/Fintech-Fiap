<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Metadados for page -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Style -->
  <!-- Style - Favicon -->
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
  <!-- Style - External -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Style - P -->
  <link rel="stylesheet" href="../style/main.css">
  <link rel="stylesheet" href="../style/login.css">
  <!-- Title of page -->
  <title>Money Minds - Login</title>
</head>
<body>
  <!-- Go back -->
  <div class="goBack p-2">
    <i class="bi bi-arrow-left" id="goBackIcon"></i>
  </div>
  <!--  -->
  <div>
    <!-- Login -->
    <div class="principalBox p-3 gap-5 d-flex flex-column align-items-center justify-content-center">
      <h2 class="roboto-mono-100-italic h2 text-center">Login</h2>
      <form class="w-75">
        <!-- Usuario -->
        <div class="mb-3">
          <label for="email-user" class="form-label roboto-mono-400 icon-login d-flex gap-2 align-items-center">
            <i class="bi bi-person-circle"></i>
            <p>Usuario</p>
          </label>
          <input type="email" class="form-control input-login" id="email-user" aria-describedby="emailHelp">
        </div>
        <!-- Password -->
        <div class="mb-3">
          <label for="password-user" class="form-label roboto-mono-400 icon-login d-flex gap-2 align-items-center">
            <i class="bi bi-lock-fill"></i>
            <p>Senha</p>
          </label>
          <input type="password" class="form-control input-login" id="password-user">
        </div>
        <!-- Lembre de mim -->
        <div class="mb-3 form-check d-flex gap-2 align-items-center">
          <input type="checkbox" class="form-check-input checkbox-login" id="checkBox-Remenber">
          <label class="form-check-label" for="checkBox-Remenber roboto-mono-400">Lembre de mim</label>
        </div>
        <!-- submit -->
        <button type="submit" class="btn roboto-mono-400 btn-login">Entrar</button>
      </form>
    </div>
    <!-- Cadastro -->
    <div>

    </div>
  </div>

  <!-- Js -->
  <script src="../js/login.js"></script>
</body>
